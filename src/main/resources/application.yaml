spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/orientir_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    module:
      kotlin:
        null-is-same-as-default: true
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 900000
  refresh-expiration-ms: 2592000000